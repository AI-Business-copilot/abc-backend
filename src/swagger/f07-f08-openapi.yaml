openapi: 3.0.3
info:
  title: ABC Retail - Returns, Audit & Lot Management API (F05 - F08)
  version: 1.0.0
  description: |
    API documentation for:
    - **F05**: Customer Returns & Counter Exchange (Khách trả & Đổi hàng tại quầy)
    - **F06**: Vendor Returns (Trả hàng Nhà cung cấp)
    - **F07**: Stock Audit (Kiểm kê tồn kho)
    - **F08**: Lot Tracking & Scrap Management (Theo dõi lô hàng & hủy hàng)
    
    All endpoints require:
    - Bearer JWT authentication (Supabase token)
    - X-Business-Id header with valid business UUID
    - Appropriate permissions for each operation

servers:
  - url: http://localhost:5000/api
    description: Local development
  - url: https://api.example.com/api
    description: Production

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase JWT token from authentication
  
  parameters:
    businessIdHeader:
      name: X-Business-Id
      in: header
      required: true
      description: Business/store UUID for multi-tenant isolation
      schema:
        type: string
        format: uuid
    
    auditId:
      name: id
      in: path
      required: true
      description: Audit UUID
      schema:
        type: string
        format: uuid
    
    auditItemId:
      name: itemId
      in: path
      required: true
      description: Audit item UUID
      schema:
        type: string
        format: uuid
    
    lotId:
      name: id
      in: path
      required: true
      description: Product lot (batch) UUID
      schema:
        type: string
        format: uuid

    lotItemId:
      name: itemId
      in: path
      required: true
      description: Product lot item UUID (one variant inside a batch)
      schema:
        type: string
        format: uuid

    shelfId:
      name: id
      in: path
      required: true
      description: Warehouse shelf UUID
      schema:
        type: string
        format: uuid

    shelfCellId:
      name: cellId
      in: path
      required: true
      description: Warehouse shelf position UUID
      schema:
        type: string
        format: uuid

    scrapOrderId:
      name: id
      in: path
      required: true
      description: Scrap order UUID
      schema:
        type: string
        format: uuid
    
    scrapImageId:
      name: imageId
      in: path
      required: true
      description: Scrap image UUID
      schema:
        type: string
        format: uuid
  
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          description: Error message in Vietnamese
          example: "Mã kiểm kê đã tồn tại trong cửa hàng này."
    
    # F07 SCHEMAS
    Audit:
      type: object
      properties:
        id:
          type: string
          format: uuid
        auditCode:
          type: string
          example: "AUDIT-2026-10-001"
        scopeType:
          type: string
          enum: [FULL_STORE, CATEGORY, SHELF]
        status:
          type: string
          enum: [DRAFT, IN_PROGRESS, PENDING_APPROVAL, APPLIED, CANCELLED]
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    
    AuditItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        snapshotQty:
          type: integer
          nullable: true
        countedQty:
          type: integer
          nullable: true
        diffQty:
          type: integer
          nullable: true
        status:
          type: string
          enum: [PENDING, SUBMITTED, APPROVED, REJECTED]
        countedDamagedQty:
          type: integer
          nullable: true
        countAgreement:
          type: string
          enum: [SINGLE, NOT_STARTED, PENDING, AGREED, CONFLICT]
        counts:
          type: array
          items:
            $ref: '#/components/schemas/AuditItemCount'
        counterDetails:
          type: array
          description: >
            The reason and broken goods of every counter. The row's own fields belong to the
            employee the row was assigned to.
          items:
            $ref: '#/components/schemas/AuditCounterDetail'
        shelfCell:
          $ref: '#/components/schemas/ShelfCellLocation'

    AuditCounterDetail:
      type: object
      description: One counter's own reason and broken goods.
      properties:
        counterUserId:
          type: string
          format: uuid
        discrepancyReason:
          type: string
          nullable: true
        countedDamagedQty:
          type: integer

    AuditItemHistory:
      type: object
      description: >
        One record of a row: what was counted when the owner approved it, rejected it or asked
        for another count. The numbers are a copy of that moment, not a link to the live row.
      properties:
        id:
          type: string
          format: uuid
        revision:
          type: integer
        action:
          type: string
          enum: [APPROVED, REJECTED, RECOUNT]
        reason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        snapshotQty:
          type: integer
        countedQty:
          type: integer
        countedDamagedQty:
          type: integer
        discrepancyReason:
          type: string
          nullable: true
        actor:
          $ref: '#/components/schemas/AuditCountPerson'
        counts:
          type: array
          description: What each counter had found at that moment.
          items:
            $ref: '#/components/schemas/AuditItemHistoryCount'
        images:
          type: array
          description: The evidence photos filed under this record.
          items:
            $ref: '#/components/schemas/AuditCountImage'

    AuditItemHistoryCount:
      type: object
      description: One counter's number at the moment of a history record.
      properties:
        id:
          type: string
          format: uuid
        counterUserId:
          type: string
          format: uuid
        counter:
          $ref: '#/components/schemas/AuditCountPerson'
        countedQty:
          type: integer
        countedDamagedQty:
          type: integer
        discrepancyReason:
          type: string
          nullable: true
        submittedAt:
          type: string
          format: date-time
          nullable: true

    AuditCountPerson:
      type: object
      description: A person taking part in the count.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string

    AuditItemCount:
      type: object
      description: One counter's own count of a row.
      properties:
        id:
          type: string
          format: uuid
        counterUserId:
          type: string
          format: uuid
        countedQty:
          type: integer
        countedDamagedQty:
          type: integer
        discrepancyReason:
          type: string
          nullable: true
        submittedAt:
          type: string
          format: date-time
          nullable: true
        images:
          type: array
          items:
            $ref: '#/components/schemas/AuditCountImage'

    AuditCountImage:
      type: object
      description: An evidence photo of the broken goods one counter found.
      properties:
        id:
          type: string
          format: uuid
        countId:
          type: string
          format: uuid
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        sizeBytes:
          type: integer
        uploadedBy:
          type: string
          format: uuid
        uploadedByName:
          type: string
        createdAt:
          type: string
          format: date-time
        url:
          type: string
          nullable: true
          description: Short-lived signed link (5 minutes). Null when storage could not sign it.
    
    AuditListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Audit'
        pagination:
          $ref: '#/components/schemas/Pagination'
    
    # F08 SCHEMAS
    ShelfCell:
      type: object
      description: One position on a shelf: a level and a slot.
      properties:
        id:
          type: string
          format: uuid
        level:
          type: integer
          description: The level of the cell, 1 is the bottom of the shelf.
        slot:
          type: integer
          description: The position on that level.
        isActive:
          type: boolean
        itemCount:
          type: integer
          description: How many lot items sit on this position.

    Shelf:
      type: object
      description: A shelf of the warehouse, with the positions it holds.
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: "A2"
        name:
          type: string
          nullable: true
        isActive:
          type: boolean
        cells:
          type: array
          items:
            $ref: '#/components/schemas/ShelfCell'
        itemCount:
          type: integer
          description: How many lot items sit on this shelf.

    ShelfCellLocation:
      type: object
      description: Where a lot item physically sits.
      properties:
        id:
          type: string
          format: uuid
        level:
          type: integer
        slot:
          type: integer
        shelf:
          type: object
          properties:
            id:
              type: string
              format: uuid
            code:
              type: string
            name:
              type: string
              nullable: true

    ExpiringLot:
      type: object
      description: One variant inside a batch, with the status calculated for today.
      properties:
        id:
          type: string
          format: uuid
          description: Lot item UUID
        lotItemId:
          type: string
          format: uuid
        lotId:
          type: string
          format: uuid
          description: Batch UUID
        variantId:
          type: string
          format: uuid
        lotNumber:
          type: string
        manufacturingDate:
          type: string
          format: date
          nullable: true
        expirationDate:
          type: string
          format: date
        effectiveStatus:
          type: string
          enum: [HEALTHY, WARNING, UNUSABLE, QUARANTINED, SCRAPPED]
        onHand:
          type: integer
        damaged:
          type: integer
        shelfCell:
          allOf:
            - $ref: '#/components/schemas/ShelfCellLocation'
          nullable: true
          description: The shelf and position the lot sits on, null when it has no location yet.

    LotDetail:
      type: object
      description: A batch header with every variant it contains.
      properties:
        id:
          type: string
          format: uuid
        lotNumber:
          type: string
        createdAt:
          type: string
          format: date-time
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExpiringLot'

    ExpiringProductSku:
      type: object
      description: One SKU of a product, with the lot items it holds.
      properties:
        id:
          type: string
          format: uuid
          description: Variant UUID
        sku:
          type: string
        lots:
          type: array
          items:
            $ref: '#/components/schemas/ExpiringLot'

    ExpiringProductGroup:
      type: object
      description: One product, with its SKUs and their lots. Returned when groupBy is `product`.
      properties:
        id:
          type: string
          format: uuid
          description: Product template UUID
        name:
          type: string
        imageUrl:
          type: string
          nullable: true
        skus:
          type: array
          items:
            $ref: '#/components/schemas/ExpiringProductSku'

    ScrapOrder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        scrapCode:
          type: string
        status:
          type: string
          enum: [PENDING, COMPLETED, REJECTED]
    
    Pagination:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    # F05 & F06 SCHEMAS
    CustomerReturnItemInput:
      type: object
      required: [variantId, returnQty, itemCondition]
      properties:
        orderItemId:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        lotId:
          type: string
          format: uuid
        returnQty:
          type: integer
          minimum: 1
          example: 1
        returnUnitPrice:
          type: string
          example: "50000.00"
        itemCondition:
          type: string
          enum: [RESTOCKABLE, DAMAGED_QUARANTINE]
          example: RESTOCKABLE
        reason:
          type: string
          example: "Lỗi đường may"
    
    ExchangeItemInput:
      type: object
      required: [variantId, quantity]
      properties:
        variantId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          example: 1
    
    CustomerReturnInput:
      type: object
      required: [refundMethod, items]
      properties:
        originalOrderId:
          type: string
          format: uuid
        originalOrderCode:
          type: string
          example: "ORD-179368"
        isUnverifiedOrigin:
          type: boolean
          default: false
        returnReason:
          type: string
          example: "Khách đổi size"
        refundMethod:
          type: string
          enum: [CASH, BANK_TRANSFER, CUSTOMER_CREDIT, EXCHANGE_OFFSET]
          example: CASH
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CustomerReturnItemInput'
        exchangeItems:
          type: array
          items:
            $ref: '#/components/schemas/ExchangeItemInput'
    
    CustomerReturn:
      type: object
      properties:
        id:
          type: string
          format: uuid
        businessId:
          type: string
          format: uuid
        returnCode:
          type: string
          example: "RET-179368001"
        originalOrderId:
          type: string
          format: uuid
        status:
          type: string
          enum: [COMPLETED, CANCELLED]
        refundMethod:
          type: string
        totalRefundAmount:
          type: string
          example: "150000.00"
        exchangeOrderId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    VendorReturnItemInput:
      type: object
      required: [variantId, returnQty, returnUnitPrice]
      properties:
        variantId:
          type: string
          format: uuid
        lotId:
          type: string
          format: uuid
        returnQty:
          type: integer
          minimum: 1
          example: 2
        returnUnitPrice:
          type: string
          example: "45000.00"
        conditionSource:
          type: string
          enum: [SELLABLE, DAMAGED_STOCK]
          default: SELLABLE
        reason:
          type: string
          example: "Hàng cận date"

    VendorReturnInput:
      type: object
      required: [supplierId, items]
      properties:
        supplierId:
          type: string
          format: uuid
        receiptId:
          type: string
          format: uuid
        returnReason:
          type: string
          example: "Xuất trả NCC do lỗi kỹ thuật"
        paymentRefundMethod:
          type: string
          enum: [DEBT_DEDUCTION, CASH, BANK_TRANSFER]
          default: DEBT_DEDUCTION
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/VendorReturnItemInput'

    VendorReturn:
      type: object
      properties:
        id:
          type: string
          format: uuid
        businessId:
          type: string
          format: uuid
        returnCode:
          type: string
          example: "VRET-179368001"
        supplierId:
          type: string
          format: uuid
        status:
          type: string
          enum: [COMPLETED, CANCELLED]
        totalReturnValue:
          type: string
          example: "90000.00"
        paymentRefundMethod:
          type: string
        createdAt:
          type: string
          format: date-time

paths:
  # F05 ENDPOINTS
  /customer-returns/lookup/{orderCode}:
    get:
      tags: [F05 Customer Returns]
      summary: Lookup order for return by order code
      parameters:
        - name: orderCode
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Returnable order details and quantities

  /customer-returns:
    get:
      tags: [F05 Customer Returns]
      summary: List customer returns
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [COMPLETED, CANCELLED]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Customer returns list
    post:
      tags: [F05 Customer Returns]
      summary: Create customer return & counter exchange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerReturnInput'
      responses:
        '201':
          description: Customer return completed successfully

  /customer-returns/{id}:
    get:
      tags: [F05 Customer Returns]
      summary: Get customer return details by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Customer return details

  # F06 ENDPOINTS
  /vendor-returns/suppliers:
    get:
      tags: [F06 Vendor Returns]
      summary: Get suppliers with current debt
      responses:
        '200':
          description: Suppliers list with current debt balance

  /vendor-returns:
    get:
      tags: [F06 Vendor Returns]
      summary: List vendor returns
      parameters:
        - name: supplierId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [COMPLETED, CANCELLED]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Vendor returns list
    post:
      tags: [F06 Vendor Returns]
      summary: Create vendor return (Owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorReturnInput'
      responses:
        '201':
          description: Vendor return created and supplier debt deducted

  /vendor-returns/{id}:
    get:
      tags: [F06 Vendor Returns]
      summary: Get vendor return details by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Vendor return details
  # F07 ENDPOINTS
  /inventory/audits:
    post:
      tags: [F07 Stock Audit]
      summary: Create new audit
      description: "Permission: inventory.audit.create"
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auditCode, scopeType]
              properties:
                auditCode:
                  type: string
                scopeType:
                  type: string
                  enum: [FULL_STORE, CATEGORY, SHELF]
                note:
                  type: string
                  nullable: true
                  maxLength: 1000
                  description: "Ghi chú của chủ cửa hàng về đợt kiểm kê (ví dụ: kiểm kê định kỳ hàng tháng)."
      responses:
        '201':
          description: Audit created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Audit'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    get:
      tags: [F07 Stock Audit]
      summary: List audits
      description: "Permission: inventory.read"
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: List of audits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditListResponse'
  
  /inventory/audits/{id}:
    get:
      tags: [F07 Stock Audit]
      summary: Get audit details
      description: "Permission: inventory.read"
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - $ref: '#/components/parameters/auditId'
      responses:
        '200':
          description: Audit details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Audit'

    delete:
      tags: [F07 Stock Audit]
      summary: Delete a draft audit
      description: >
        "Permission: inventory.audit.create. Owner only. Only a DRAFT audit can be deleted; a running
        audit has been counted already and can only be cancelled. The audit's rows, counts, photos
        and history go with it."
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - $ref: '#/components/parameters/auditId'
      responses:
        '204':
          description: Audit deleted
        '404':
          description: The audit does not exist in this business
        '409':
          description: The audit is not a draft

  /inventory/audits/{id}/start:
    patch:
      tags: [F07 Stock Audit]
      summary: Start the counting of a draft audit
      description: >
        "Permission: inventory.audit.create. Owner only. The SKUs are locked and the snapshot is
        taken at this moment, so the audit compares against the stock of now."
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - $ref: '#/components/parameters/auditId'
      responses:
        '200':
          description: Audit started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Audit'
        '400':
          description: The draft has no rows
        '409':
          description: The audit is not a draft

  /inventory/audits/{id}/cancel:
    patch:
      tags: [F07 Stock Audit]
      summary: Cancel a running audit
      description: >
        "Permission: inventory.audit.create. Owner only. A running audit cannot be deleted, only
        cancelled. Cancelling frees the locked SKUs again."
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - $ref: '#/components/parameters/auditId'
      responses:
        '200':
          description: Audit cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Audit'
        '409':
          description: The audit is not running

  /inventory/audits/{id}/items/assign:
    post:
      tags: [F07 Stock Audit]
      summary: Assign items to employees
      description: "Permission: inventory.audit.create"
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - $ref: '#/components/parameters/auditId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Items assigned
  
  /inventory/audits/{id}/items/{itemId}/assign:
    patch:
      tags: [F07 Stock Audit]
      summary: Reassign item
      description: "Permission: inventory.audit.create"
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - $ref: '#/components/parameters/auditId'
        - $ref: '#/components/parameters/auditItemId'
      responses:
        '200':
          description: Item reassigned
  
  /inventory/audits/{id}/items:
    post:
      tags: [F07 Stock Audit]
      summary: Record count
      description: "Permission: inventory.audit.count"
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - $ref: '#/components/parameters/auditId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variantId, countedQty]
              properties:
                variantId:
                  type: string
                  format: uuid
                countedQty:
                  type: integer
      responses:
        '201':
          description: Count recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditItem'
    
    get:
      tags: [F07 Stock Audit]
      summary: List audit items
      description: "Permission: inventory.read"
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - $ref: '#/components/parameters/auditId'
        - name: page
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: List of audit items
  
  /inventory/audits/{id}/items/{itemId}:
    get:
      tags: [F07 Stock Audit]
      summary: Get audit item
      description: "Permission: inventory.read"
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - $ref: '#/components/parameters/auditId'
        - $ref: '#/components/parameters/auditItemId'
      responses:
        '200':
          description: Audit item details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditItem'
    
    patch:
      tags: [F07 Stock Audit]
      summary: Update count
      description: >-
        "Permission: inventory.audit.count. The body may be JSON, or multipart/form-data when the
        count carries evidence photos of the broken goods. At least one photo is required when
        countedDamagedQty is greater than zero."
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - $ref: '#/components/parameters/auditId'
        - $ref: '#/components/parameters/auditItemId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                countedQty:
                  type: integer
                countedDamagedQty:
                  type: integer
                discrepancyReason:
                  type: string
          multipart/form-data:
            schema:
              type: object
              properties:
                countedQty:
                  type: integer
                countedDamagedQty:
                  type: integer
                discrepancyReason:
                  type: string
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: Count updated
        '400':
          description: Broken goods found without an evidence photo
        '415':
          description: The uploaded file is not a JPEG, PNG or WebP image

    delete:
      tags: [F07 Stock Audit]
      summary: Delete one row of a draft audit
      description: >
        "Permission: inventory.audit.create. Owner only. Only a DRAFT audit can have its rows
        removed."
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - $ref: '#/components/parameters/auditId'
        - $ref: '#/components/parameters/auditItemId'
      responses:
        '204':
          description: Audit item deleted
        '404':
          description: The audit or the row does not exist in this business
        '409':
          description: The audit is not a draft

  /inventory/audits/{id}/items/{itemId}/counts/{countId}/images:
    get:
      tags: [F07 Stock Audit]
      summary: List the evidence photos of one counter's count
      description: "Permission: inventory.read"
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - $ref: '#/components/parameters/auditId'
        - $ref: '#/components/parameters/auditItemId'
        - name: countId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The photos of this count with short-lived signed links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditCountImage'
        '403':
          description: The caller is neither the owner nor the counter of this count
        '404':
          description: The count does not exist in this business

  /inventory/audit-count-images/{imageId}:
    get:
      tags: [F07 Stock Audit]
      summary: Get one evidence photo of an audit count
      description: "Permission: inventory.read"
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - name: imageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The photo with a short-lived signed link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditCountImage'
        '403':
          description: The caller is neither the owner nor the counter who took the photo
        '404':
          description: The photo does not exist in this business

  /inventory/audits/{id}/items/{itemId}/history:
    get:
      tags: [F07 Stock Audit]
      summary: Get the history of one audit row
      description: >
        Permission: inventory.read. Only the business owner may read it: the history holds what
        both counters found, so a staff member must not see it.
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - $ref: '#/components/parameters/auditId'
        - $ref: '#/components/parameters/auditItemId'
      responses:
        '200':
          description: The records of this row, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditItemHistory'
        '403':
          description: The caller is not the owner of this business
        '404':
          description: The row does not exist in this business

  /inventory/audits/{id}/items/{itemId}/submit:
    post:
      tags: [F07 Stock Audit]
      summary: Submit item for approval
      description: "Permission: inventory.audit.submit_item"
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - $ref: '#/components/parameters/auditId'
        - $ref: '#/components/parameters/auditItemId'
      responses:
        '200':
          description: Item submitted
  
  /inventory/audits/{id}/items/{itemId}/approve:
    patch:
      tags: [F07 Stock Audit]
      summary: Approve item
      description: "Permission: inventory.audit.approve_item"
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - $ref: '#/components/parameters/auditId'
        - $ref: '#/components/parameters/auditItemId'
      responses:
        '200':
          description: Item approved
  
  /inventory/audits/{id}/items/{itemId}/reject:
    patch:
      tags: [F07 Stock Audit]
      summary: Reject item
      description: "Permission: inventory.audit.approve_item"
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - $ref: '#/components/parameters/auditId'
        - $ref: '#/components/parameters/auditItemId'
      responses:
        '200':
          description: Item rejected

  /inventory/audits/{id}/items/{itemId}/recount:
    patch:
      tags: [F07 Stock Audit]
      summary: Send a disputed row back to both counters
      description: >-
        "Permission: inventory.audit.approve_item. Used when the two counters disagree: the row goes
        back to both of them for another count and the old numbers are cleared."
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - $ref: '#/components/parameters/auditId'
        - $ref: '#/components/parameters/auditItemId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: The row was sent back for another count
        '409':
          description: The row does not have two counters, or they already agree
  
  /inventory/audits/{id}/approve:
    patch:
      tags: [F07 Stock Audit]
      summary: Approve audit
      description: "Permission: inventory.audit.approve"
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - $ref: '#/components/parameters/auditId'
      responses:
        '200':
          description: Audit approved
  
  /inventory/audits/{id}/apply:
    patch:
      tags: [F07 Stock Audit]
      summary: Apply audit to inventory
      description: "Permission: inventory.audit.apply"
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - $ref: '#/components/parameters/auditId'
      responses:
        '200':
          description: Audit applied
  
  # F08 ENDPOINTS
  /inventory/lots/expiring:
    get:
      tags: [F08 Lot Management]
      summary: List expiring lots
      description: "Permission: inventory.lot.read"
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - name: status
          in: query
          schema:
            type: string
            enum: [HEALTHY, WARNING, UNUSABLE, QUARANTINED, SCRAPPED]
        - name: groupBy
          in: query
          description: Set to `lot` to page over batches instead of items. Each entry then holds `id`, `lotNumber` and the matching `items`. Set to `product` to page over products instead: each entry holds `id`, `name`, `imageUrl` and the `skus` it contains, each SKU holding its `lots`.
          schema:
            type: string
            enum: [lot, product]
        - name: shelfCellId
          in: query
          description: Only the lots that sit on this shelf position.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of expiring lots
  
  /inventory/lots/{id}:
    get:
      tags: [F08 Lot Management]
      summary: Get lot details
      description: "Permission: inventory.lot.read. Returns the batch with one entry per variant."
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - $ref: '#/components/parameters/lotId'
      responses:
        '200':
          description: Lot details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LotDetail'
  
  /inventory/lots/{lotId}/items/{itemId}/shelf:
    patch:
      tags: [F08 Lot Management]
      summary: Put a lot item on a shelf
      description: >
        "Permission: inventory.scrap.create. Records where the lot physically sits, as
        `Ke A2 - Tang 3 - O 04`. The cell is created when it does not exist yet, so the staff
        only pick a shelf, a level and a slot."
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - $ref: '#/components/parameters/lotId'
        - $ref: '#/components/parameters/lotItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shelfId, level, slot]
              properties:
                shelfId:
                  type: string
                  format: uuid
                level:
                  type: integer
                  minimum: 1
                slot:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: The lot item was put on the shelf
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  shelfCell:
                    $ref: '#/components/schemas/ShelfCellLocation'

  /inventory/shelves:
    get:
      tags: [F08 Lot Management]
      summary: List the shelves of the warehouse
      description: "Permission: inventory.lot.read. Every shelf with the positions it holds."
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
      responses:
        '200':
          description: The shelves of this business
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Shelf'
    post:
      tags: [F08 Lot Management]
      summary: Create a shelf
      description: "Permission: inventory.shelf.manage. The shelf code is unique inside the business."
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  example: "A2"
                name:
                  type: string
                  nullable: true
      responses:
        '201':
          description: The shelf was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shelf'

  /inventory/shelves/{id}:
    patch:
      tags: [F08 Lot Management]
      summary: Update a shelf
      description: "Permission: inventory.shelf.manage. Renames the shelf or changes its code."
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - $ref: '#/components/parameters/shelfId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                name:
                  type: string
                  nullable: true
      responses:
        '200':
          description: The updated shelf
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shelf'
    delete:
      tags: [F08 Lot Management]
      summary: Retire a shelf
      description: >
        "Permission: inventory.shelf.manage. The shelf is retired, not deleted: the lot items
        still point at its cells."
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - $ref: '#/components/parameters/shelfId'
      responses:
        '204':
          description: The shelf was retired

  /inventory/shelves/{id}/cells:
    post:
      tags: [F08 Lot Management]
      summary: Create a position on a shelf
      description: "Permission: inventory.shelf.manage. A position is a level and a slot on the shelf."
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - $ref: '#/components/parameters/shelfId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level, slot]
              properties:
                level:
                  type: integer
                  minimum: 1
                slot:
                  type: integer
                  minimum: 1
      responses:
        '201':
          description: The position was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShelfCell'

  /inventory/shelves/cells/{cellId}:
    patch:
      tags: [F08 Lot Management]
      summary: Move a position on a shelf
      description: >
        "Permission: inventory.shelf.manage. Moves a position to another level and slot on the
        same shelf. The goods on it move with it: the lot items keep pointing at it."
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - $ref: '#/components/parameters/shelfCellId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                level:
                  type: integer
                  minimum: 1
                slot:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: The position was moved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShelfCell'
    delete:
      tags: [F08 Lot Management]
      summary: Retire a position on a shelf
      description: >
        "Permission: inventory.shelf.manage. The position is retired, not deleted: the lot items
        still point at it, so they keep their location."
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - $ref: '#/components/parameters/shelfCellId'
      responses:
        '204':
          description: The position was retired

  /inventory/lots/{lotId}/items/{itemId}/quarantine:
    post:
      tags: [F08 Lot Management]
      summary: Quarantine one variant of a lot
      description: "Permission: inventory.scrap.create. Quarantines a single lot item; the other variants in the same batch are unaffected."
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - $ref: '#/components/parameters/lotId'
        - $ref: '#/components/parameters/lotItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: integer
                  minimum: 1
                note:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Lot item quarantined

  /inventory/variants/{variantId}/quarantine:
    get:
      tags: [F08 Lot Management]
      summary: Get the quarantine of a product without a lot item
      description: "Permission: inventory.lot.read. A product with no lot item keeps its quarantine on the variant."
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - name: variantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The quarantine of this variant
        '404':
          description: The variant is not quarantined

    post:
      tags: [F08 Lot Management]
      summary: Quarantine a product without a lot item
      description: "Permission: inventory.scrap.create. Quarantines the variant itself."
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - name: variantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: integer
                  minimum: 1
                note:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Variant quarantined

  /inventory/scrap-orders:
    post:
      tags: [F08 Scrap Management]
      summary: Create scrap order with images
      description: "Permission: inventory.scrap.create. Multipart/form-data upload."
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [lotItemId, scrapQty, causeCode, disposalMethod, disposalLocation]
              properties:
                lotItemId:
                  type: string
                  format: uuid
                  description: The quarantined lot item to scrap.
                scrapQty:
                  type: integer
                causeCode:
                  type: string
                  enum: [EXPIRED, DAMAGED_TRANSIT, QUALITY_FAIL, OLD_STOCK]
                  description: The cause of the loss, as the disposal dossier states it.
                disposalMethod:
                  type: string
                  enum: [INCINERATION, BURIAL, CHEMICAL, CONTRACTOR]
                  description: How the goods are destroyed.
                disposalLocation:
                  type: string
                  maxLength: 255
                  description: Where the goods are destroyed.
                scrapSource:
                  type: string
                  enum: [DAMAGED_STOCK, SELLABLE_STOCK]
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Scrap order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrapOrder'
    
    get:
      tags: [F08 Scrap Management]
      summary: List scrap orders
      description: "Permission: inventory.lot.read"
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
      responses:
        '200':
          description: List of scrap orders
  
  /inventory/scrap-orders/{id}:
    get:
      tags: [F08 Scrap Management]
      summary: Get scrap order details
      description: "Permission: inventory.lot.read"
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - $ref: '#/components/parameters/scrapOrderId'
      responses:
        '200':
          description: Scrap order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrapOrder'
    
    patch:
      tags: [F08 Scrap Management]
      summary: Update scrap order
      description: "Permission: inventory.scrap.create"
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - $ref: '#/components/parameters/scrapOrderId'
      responses:
        '200':
          description: Scrap order updated
    
    delete:
      tags: [F08 Scrap Management]
      summary: Delete scrap order
      description: "Permission: inventory.scrap.create"
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - $ref: '#/components/parameters/scrapOrderId'
      responses:
        '204':
          description: Scrap order deleted
  
  /inventory/scrap-orders/{id}/approve:
    patch:
      tags: [F08 Scrap Management]
      summary: Approve scrap order
      description: "Permission: inventory.scrap.approve. Owner only."
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - $ref: '#/components/parameters/scrapOrderId'
      responses:
        '200':
          description: Scrap order approved
  
  /inventory/scrap-orders/{id}/reject:
    patch:
      tags: [F08 Scrap Management]
      summary: Reject scrap order
      description: "Permission: inventory.scrap.approve. Owner only."
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - $ref: '#/components/parameters/scrapOrderId'
      responses:
        '200':
          description: Scrap order rejected

  /inventory/scrap-orders/{id}/cancel:
    patch:
      tags: [F08 Scrap Management]
      summary: Cancel scrap order
      description: "Permission: inventory.scrap.approve. Owner only. Closes a PENDING order without touching stock; the lot item stays QUARANTINED."
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - $ref: '#/components/parameters/scrapOrderId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Scrap order cancelled

  /inventory/scrap-orders/{id}/dossier:
    patch:
      tags: [F08 Scrap Management]
      summary: Record the disposal dossier of a scrap order
      description: "Permission: inventory.scrap.create. Staff or owner, while the order is PENDING. Records the parts of the disposal dossier the tax file asks for (Thông tư 78/2014, amended by Thông tư 96/2015)."
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - $ref: '#/components/parameters/scrapOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                causeCode:
                  type: string
                  enum: [EXPIRED, DAMAGED_TRANSIT, QUALITY_FAIL, OLD_STOCK]
                compensatedAmount:
                  type: number
                  description: The amount recovered from an insurer or a third party. Only the loss that was not compensated may be deducted.
                disposalDate:
                  type: string
                  format: date-time
                disposalMethod:
                  type: string
                  enum: [INCINERATION, BURIAL, CHEMICAL, CONTRACTOR]
                disposalLocation:
                  type: string
                  maxLength: 255
                  description: Required when the method is CONTRACTOR.
                witnessNames:
                  type: string
                  maxLength: 500
                  description: The council members, separated by commas. At least two are needed.
      responses:
        '200':
          description: Dossier recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrapOrder'

  /inventory/scrap-orders/{id}/confirm-disposal:
    patch:
      tags: [F08 Scrap Management]
      summary: Confirm the physical disposal of a scrap order
      description: "Permission: inventory.scrap.approve. Owner only, on an approved order. Records the day the goods were physically destroyed; the stock was already written off at approval."
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - $ref: '#/components/parameters/scrapOrderId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                disposalDate:
                  type: string
                  format: date-time
                  description: Defaults to now. A date in the future is refused.
      responses:
        '200':
          description: Physical disposal confirmed

  /inventory/scrap-orders/{id}/dossier-report:
    get:
      tags: [F08 Scrap Management]
      summary: Get the disposal dossier report
      description: "Permission: inventory.lot.read. Only for an approved order. Returns the six steps of the disposal procedure, the bảng kê xuất nhập tồn and the tax amounts, so the frontend can print it as a PDF."
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - $ref: '#/components/parameters/scrapOrderId'
      responses:
        '200':
          description: Dossier report
        '409':
          description: The order is not approved yet

  /inventory/scrap-statistics:
    get:
      tags: [F08 Scrap Management]
      summary: Get scrap statistics
      description: "Permission: inventory.lot.read"
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
      responses:
        '200':
          description: Scrap statistics
  
  /inventory/scrap-orders/{id}/images:
    get:
      tags: [F08 Scrap Management]
      summary: List scrap order images
      description: "Permission: inventory.lot.read"
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - $ref: '#/components/parameters/scrapOrderId'
      responses:
        '200':
          description: List of images
  
  /inventory/scrap-order-images/{imageId}:
    get:
      tags: [F08 Scrap Management]
      summary: Get image details
      description: "Permission: inventory.lot.read"
      parameters:
        - $ref: '#/components/parameters/businessIdHeader'
        - $ref: '#/components/parameters/scrapImageId'
      responses:
        '200':
          description: Image details
